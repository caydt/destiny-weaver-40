<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A0"/>
      <stop offset="45%" stop-color="#F5C542"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="32" height="32" fill="black"/>
      <circle cx="16" cy="16" r="13" fill="white"/>
      <circle cx="20.5" cy="12.5" r="11.5" fill="black"/>
    </mask>
  </defs>
  <circle cx="16" cy="16" r="15" fill="url(#glow)"/>
  <rect width="32" height="32" mask="url(#crescent)" fill="url(#moon)"/>
</svg>
